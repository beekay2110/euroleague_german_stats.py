name: Daily EuroLeague German Stats Bot

on:
  schedule:
    # Führt das Skript jeden Morgen um 07:30 Uhr UTC (08:30 / 09:30 Uhr deutscher Zeit) aus
    - cron: '30 7 * * *'
  workflow_dispatch: # Erlaubt den manuellen Start per Klick

jobs:
  run-euroleague-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: EuroLeague Skript ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python euroleague_german_stats.py
